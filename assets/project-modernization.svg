<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise HR process modernization</title><desc id="desc">Legacy J2EE workflows modernized into Spring Boot and React services.</desc>
  <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a22"/><stop offset="1" stop-color="#123c46"/></linearGradient><pattern id="g1" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#83c5be" stroke-opacity=".06"/></pattern></defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg1)"/><rect width="1200" height="300" rx="22" fill="url(#g1)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="54" y="60" fill="#83c5be" font-size="15" font-weight="700" letter-spacing="2">ENTERPRISE MODERNIZATION</text><text x="54" y="104" fill="#f5fbfc" font-size="32" font-weight="700">Two HR workflows. One careful migration.</text><text x="54" y="138" fill="#9dbfc4" font-size="17">Preserving Oracle and PL/SQL integrations while rebuilding the application layer.</text></g>
  <g transform="translate(62 181)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="174" height="70" rx="13" fill="#0a222b" stroke="#cf6679" stroke-opacity=".7"/><text x="87" y="31" text-anchor="middle" fill="#e6b3bd" font-size="14" font-weight="700">LEGACY J2EE</text><text x="87" y="52" text-anchor="middle" fill="#8eafb4" font-size="12">business rules</text>
    <path d="M252 35h80" stroke="#36bcf7" stroke-width="3" stroke-linecap="round"/><path d="m321 24 13 11-13 11" fill="none" stroke="#36bcf7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="410" width="184" height="70" rx="13" fill="#0b3037" stroke="#83c5be"/><text x="502" y="31" text-anchor="middle" fill="#d8f3f1" font-size="14" font-weight="700">SPRING BOOT</text><text x="502" y="52" text-anchor="middle" fill="#83c5be" font-size="12">secure APIs</text>
    <rect x="626" width="184" height="70" rx="13" fill="#0b3037" stroke="#36bcf7"/><text x="718" y="31" text-anchor="middle" fill="#d8f3f1" font-size="14" font-weight="700">REACT</text><text x="718" y="52" text-anchor="middle" fill="#83c5be" font-size="12">modern workflows</text>
    <rect x="842" width="184" height="70" rx="13" fill="#0a222b" stroke="#f39c6b" stroke-opacity=".8"/><text x="934" y="31" text-anchor="middle" fill="#f8d6c3" font-size="14" font-weight="700">ORACLE · PL/SQL</text><text x="934" y="52" text-anchor="middle" fill="#8eafb4" font-size="12">preserved data layer</text>
